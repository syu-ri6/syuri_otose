/* =========================================================
   TITLE SCREEN v2
   Proper romance-simulation opening using the approved assets.
   ========================================================= */
.start{
  position:relative !important;
  min-height:100svh !important;
  width:100% !important;
  overflow:hidden !important;
  display:block !important;
  padding:0 !important;
  isolation:isolate;
  background:#fff1f8 !important;
}
.start-bg{
  position:absolute;
  inset:-8px;
  z-index:-3;
  background-size:cover;
  background-position:center;
  filter:saturate(.82) brightness(1.04) blur(1px);
  transform:scale(1.035);
}
.start::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:

}

  content:"";

  z-index:-1;

  background-image:
    radial-gradient(circle at 10% 19%,#fff 0 2px,transparent 3px),

.approved-title-screen{
  min-height:100svh !important;

.approved-title-canvas{

  display:flex;

@keyframes approvedShuriFloat{
  0%,100%{transform:translateY(10%)}
  50%{transform:translateY(9.2%)}

.approved-start-hit{
  position:absolute;
  z-index:8;
  left:16.5%;
  top:76.6%;

.approved-start-hit::after{
  content:"";

  inset:5%;
  border-radius:999px;

  background:rgba(255,255,255,.10);
  box-shadow:0 0 28px rgba(255,255,255,.78),0 0 55px rgba(255,112,190,.44);

@media (max-width:430px){.approved-title-canvas{max-width:none;}}

ery_true":{"id":"end_recovery_true","text":"🩹💘🐰\nRECOVERY TRUE END\n一回ダメだったから、むしろ強くなった\n最初から完璧だったルートとは違う。\n一度「この人合わないかも」まで行った。でも、ズレを認め、言い訳せず、行動を変え、もう一度信頼を作った。\nその結果しゅりの中に、\n「この人とは問題が起きても話し合える」\nという別種の安心ができた。\nしゅり\n「最初ほんと無理かと思ったのにwwww\nでも今は、なんかあってもちゃんと戻れそうって思う。そういうの結構好き。」\nこのENDが強い理由\n関係の安全性は「衝突がゼロ」だけでは作られない。衝突後に修復できた経験は、「ズレても関係が壊れない」という予測可能性を作る。\nダメダメからもう一度","choices":[],"expr":"normal","prologue":"［しゅりとの会話が続いている。］","tag":"","bg":"backgrounds/18_happy_end.png"},"m1":{"id":"m1","text":"……なんか今日それ嫌かも。昨日は別に平気だったんだけど。え、なんで？私も分からん。","choices":[{"text":"了解。理由はあとで分かるかもだし、今日はやめとこ","to":"m2"},{"text":"昨日は大丈夫だったなら、今日だけ違う理由があるのかな？","to":"end_analysis"},{"text":"昨日と今日で変わると、こっちもちょっと対応むずかしいかも","to":"b1"}],"expr":"confused","prologue":"［昨日は普通に笑っていた話題。今日、同じノリで触れた瞬間、しゅりの反応が少し変わった。］","tag":"昨日は平気だったのに今日は嫌","bg":"backgrounds/20_mystery.png"},"m2":{"id":"m2","text":"さっきのさ、今分かった。内容が嫌だったんじゃなくて、今日あのノリでいじられるのが嫌だったんだと思う。……今さら分かるんかい。","choices":[{"text":"あとから分かることもあるんだな","to":"m3"},{"text":"なるほど。内容じゃなくてタイミングだったんだね","to":"m3"},{"text":"それが最初に分かってたら、こっちも対応しやすかったかも","to":"end_cold"}],"expr":"interest","prologue":"［数時間後。さっきの会話について、しゅりから追加のメッセージが届いた。］","tag":"後追い感情認識","bg":"backgrounds/20_mystery.png"},"m3":{"id":"m3","text":"ねえ聞いて、今日コンビニでさwwww ……いやさっきの話と全然関係ないけど聞いて。","choices":[{"text":"話かなり飛んだけど、今の方が本題ってこと？","to":"b1"},{"text":"うんうん、全部聞くよ","to":"end_overkind"},{"text":"話の着地点そこだったんだww でも続き聞きたい","to":"m4"}],"expr":"confused","prologue":"［その5分後。さっきまでの話とはまったく関係ないメッセージが飛んできた。］","tag":"会話のワープ","bg":"backgrounds/20_mystery.png"},"m4":{"id":"m4","text":"なんか今日めっちゃ話しやすい。……いや、別に特別って意味じゃないけど。……いや特別じゃないとも言ってない。","choices":[{"text":"特別かどうかは今決めなくていいけど、俺も話しやすい","to":"m5"},{"text":"了解。じゃあ特別扱いはしないでおく","to":"end_flat"},{"text":"深い意味ないって言うけど、少しは特別ってことじゃない？","to":"end_push"}],"expr":"shy","prologue":"［しばらく雑談が続き、いつもより少し距離が近い空気になってきた。］","tag":"接近→撤退","bg":"backgrounds/20_mystery.png"},"m5":{"id":"m5","text":"なんかさ、別に何かされたわけじゃないのに、今日ちょっとあなたのこと気になってた。何これ。知らん。","choices":[{"text":"それって、もう結構好きに近いんじゃない？","to":"end_label"},{ function isEnd(id){return id.startsWith('end_')}
function contextualModes(s){let q=(s.text+' '+s.prologue+' '+s.tag).toLowerCase(); if(s.choices.length!==3)return ['choice']; if(/告白|好き|付き合/.test(q))return ['hold','choice','wait']; if(/写真|服|どっち/.test(q))return ['swipe','distance','choice']; if(/メッセージ|既読/.test(q))return ['read','choice','wait']; if(s.text.length>75)return ['interrupt','wait','choice','hold']; return ['choice','hold','wait','reorder','distance','swipe','free'];}
function modeFor(s){let key='op:'+s.id;let x=sessionStorage.getItem(key);if(x)return x;let pool=contextualModes(s);x=pool[Math.floor(Math.random()*pool.length)];sessionStorage.setItem(key,x);return x}
function go(id,answer=''){if(!SCENES[id])return;if(answer)log.push({scene:current,answer});current=id;render()}
function frame(s,reply){return `<div class="spark"></div><div class="app"><div class="top"><img class="logo" src="${U['ui/logo_title.png']}"><button class="iconbtn heart" onclick="openLog()"></button><button class="iconbtn menu" onclick="openMenu()"></button></div><div class="subtop"><div class="nameplate"></div><div class="dayplate"></div></div><div class="system"></div><div class="stage"><img class="bg" src="${U[s.bg]}"><div class="veil"></div><img class="avatar" src="${U[avatarMap[s.expr]||avatarMap.normal]}"><div class="live"></div><div class="aff"></div><div class="time">☾ SCENE ${s.id.toUpperCase()}</div></div><div class="scene"><div class="sceneBar">${esc(s.prologue)}</div><div class="dialog"><span class="speaker">しゅり</span>${esc(s.text)}</div>${reply}</div><div class="footer">♥　SYURI LOVE SIMULATION　♥</div></div>`}
function esc(x){return String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])).replace(/\n/g,'<br>')}
function choiceHtml(opts){return `<div class="choices">${opts.map((o,i)=>`<button class="choice" data-n="${i+1}" onclick='pick(${JSON.stringify(o.to)},${JSON.stringify(o.text)})'>${esc(o.text)}</button>`).join('')}</div>`}
window.pick=(to,text)=>go(to,text);
function firstChoiceHtml(opts){
  return `<div class="firstChoices">${opts.map((o,i)=>`
    <button class="firstChoice" onclick='pick(${JSON.stringify(o.to)},${JSON.stringify(o.text)})'>
      <img class="firstChoiceBg" src="asset_e4158dcff994.png" alt="">
      <span class="firstChoiceNo">${i+1}</span>
      <span class="firstChoiceText">${esc(o.text)}</span>
      <span class="firstChoiceHeart">♡</span>
    </button>`).join('')}</div>`
}

function renderFirstScene(s,opts){
  const av=U[avatarMap[s.expr]||avatarMap.normal];
  app.innerHTML=`
    <div class="firstPage">
      <div class="firstGlow"></div>

      <header class="firstTop">
        <img class="firstLogo" src="${U['ui/logo_title.png']}" alt="しゅりを落とせ。">
        <button class="firstIcon" onclick="openLog()"><img src="${U['ui/heart_button.png']}" alt="ログ"></button>
        <button class="firstIcon" onclick="openMenu()"><img src="${U['ui/menu_button.png']}" alt="メニュー"></button>
      </header>

      <div class="firstHud">
        <img class="firstName" src="${U['ui/name_plate.png']}" alt="しゅり">
        <img class="firstDay" src="${U['ui/day_plate.png']}" alt="DAY 07 観察モード">
      </div>

      <div class="firstAnalyze">
        <img src="${U['ui/analyzing_bar.png']}" alt="ANALYZING">
      </div>

      <section class="firstStage">
        <img class="firstBg" src="${U[s.bg]}" alt="">
        <div class="firstStageVeil"></div>
        <img class="firstAvatar" src="${av}" alt="しゅり">
        <div class="firstGlassFrame" aria-hidden="true"></div>
        <img class="firstLive" src="${U['ui/live_badge.png']}" alt="LIVE">
        <img class="firstAff" src="${U['ui/affection_bar.png']}" alt="好感度">
        <div class="firstTime">☾ 配信後・深夜</div>
      </section>

      <section class="firstSceneArea">
        <div class="firstSceneBar">
          <img src="${U['ui/scene_bar.png']}" alt="">
          <p>${esc(s.prologue)}</p>
        </div>

        <div class="firstDialog">
          <img src="${U['ui/dialogue_window.png']}" alt="">
          <span class="firstSpeaker">しゅり</span>
          <p>${esc(s.text)}</p>
        </div>

        ${firstChoiceHtml(opts)}
      </section>
    </div>`;
  applyVars();
  window.scrollTo({top:0,behavior:'instant'});
}

function render(){
  let s=SCENES[current];
  if(!s)return;
  if(isEnd(current)){renderEnd(s);return}
  let opts=shuffle(s.choices);

  // Opening question is deliberately a classic 3-choice screen.
  // Special controls start appearing naturally from later scenes.
  if(current==='s1h'){
    renderFirstScene(s,opts);
    return;
  }

  let shell=`<div class="reply"><div class="oplabel">REPLY</div><div id="op"></div></div>`;
  app.innerHTML=frame(s,shell);
  applyVars();
  renderOp(s,opts,modeFor(s));
  window.scrollTo({top:0,behavior:'instant'});
}
function applyVars(){document.documentElement.style.cssText+=`;--heart:url(${U['ui/heart_button.png']});--menu:url(${U['ui/menu_button.png']});--name:url(${U['ui/name_plate.png']});--day:url(${U['ui/day_plate.png']});--analyze:url(${U['ui/analyzing_bar.png']});--live:url(${U['ui/live_badge.png']});--aff:url(${U['ui/affection_bar.png']});--scene:url(${U['ui/scene_bar.png']});--dialog:url(${U['ui/dialogue_window.png']})`}
function renderOp(s,opts,mode){let op=$('#op'); if(!op)return; if(mode==='choice'){op.innerHTML=choiceHtml(opts);return}
if(mode==='hold'){op.innerHTML=`<div class="panel"><div class="subtle">返事を選んで、長押しで送信。</div><div id="holds"></div><button id="send" class="bigbtn" disabled>長押しして送信<div class="progress"><i></i></div></button></div>`;let sel=null;$('#holds').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=opts[+b.dataset.i];$('#send').disabled=false});let t;let b=$('#send'),bar=b.querySelector('i');let start=()=>{if(!sel)return;bar.style.transition='width .9s linear';bar.style.width='100%';t=setTimeout(()=>go(sel.to,sel.text),900)};let stop=()=>{clearTimeout(t);bar.style.transition='none';bar.style.width='0'};b.onpointerdown=start;b.onpointerup=stop;b.onpointerleave=stop;return}
if(mode==='wait'){op.innerHTML=`<div class="waitbox">しゅり、まだ入力中…　● ● ●</div>`;setTimeout(()=>{if($('#op'))op.innerHTML=choiceHtml(opts)},1500+Math.random()*1800);return}
if(mode==='reorder'){let arr=[...opts];let draw=()=>{op.innerHTML=`<div class="rows">${arr.map((o,i)=>`<div class="row"><span>${esc(o.text)}</span><button onclick="up(${i})">↑</button><button onclick="dn(${i})">↓</button></div>`).join('')}</div><button class="bigbtn" style="margin-top:8px" onclick="pick('${arr[0].to}',${JSON.stringify(arr[0].text)})">一番上から話す</button>`};window.up=i=>{if(i){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];draw()}};window.dn=i=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];draw()}};draw();return}
if(mode==='distance'){op.innerHTML=`<div class="panel"><div class="labels"><span>そっとする</span><span>そのまま</span><span>踏み込む</span></div><input id="range" class="slider" type="range" min="0" max="100" value="50"><div class="subtle" id="rtext">今の距離を選ぶ。</div><button class="bigbtn" id="rgo" style="margin-top:8px">この距離で返す</button></div>`;$('#rgo').onclick=()=>{let v=+$('#range').value,o=opts[v<34?0:v<67?1:2];go(o.to,o.text)};return}
if(mode==='swipe'){op.innerHTML=`<div id="sw" class="swipe">今のしゅりに、どう近づく？<br><small>← 少し引く　・　そのまま　・　少し近づく →</small></div><div class="tri"><button>←</button><button>○</button><button>→</button></div>`;let card=$('#sw'),sx=0,dx=0;card.onpointerdown=e=>{sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId)};card.onpointermove=e=>{if(!sx)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`};card.onpointerup=()=>{let i=dx<-60?0:dx>60?2:1;go(opts[i].to,opts[i].text)};document.querySelectorAll('.tri button').forEach((b,i)=>b.onclick=()=>go(opts[i].to,opts[i].text));return}
if(mode==='read'){let start=performance.now();op.innerHTML=`<button class="notify" id="note"><small>しゅりからメッセージ</small><b>「ねえ、ちょっと聞いていい？」</b></button><div class="subtle" style="margin-top:7px">開くタイミングも、そのまま会話になる。</div>`;$('#note').onclick=()=>{let t=(performance.now()-start)/1000,i=t<1.4?0:t<3.6?1:2;go(opts[i].to,'既読タイミング')};return}
if(mode==='interrupt'){let full=s.text;let d=$('.dialog');d.innerHTML='<span class="speaker">しゅり</span><span id="typed"></span>';op.innerHTML=`<button class="bigbtn" id="intr">待って、そこ聞きたい</button><div class="subtle" style="margin-top:7px">しゅりはまだ喋ってる。</div>`;let i=0,done=false;let timer=setInterval(()=>{i+=2;if($('#typed'))$('#typed').innerHTML=esc(full.slice(0,i));if(i>=full.length){clearInterval(timer);done=true;op.innerHTML=choiceHtml(opts)}},42);$('#intr').onclick=()=>{clearInterval(timer);if($('#typed'))$('#typed').innerHTML=esc(full.slice(0,i));op.innerHTML=`<div class="panel"><b>しゅり「まだ喋ってるwwwwww」</b></div>`+choiceHtml(opts)};return}
if(mode==='free'){op.innerHTML=`<div class="panel"><textarea id="free" class="free" placeholder="返事を入力…"></textarea><button id="fgo" class="bigbtn" style="margin-top:8px">送る</button><div class="subtle" style="margin-top:7px">文章そのものより、どの返事に近いかで会話が進む。</div></div>`;$('#fgo').onclick=()=>{let q=$('#free').value.trim();if(!q)return;let sim=(a,b)=>{let A=new Set([...a]),B=new Set([...b]);let n=[...A].filter(x=>B.has(x)).length;return n/(A.size+B.size-n||1)};let best=opts.map(o=>[sim(q,o.text),o]).sort((a,b)=>b[0]-a[0])[0][1];go(best.to,q)};return}
op.innerHTML=choiceHtml(opts)}
function renderEnd(s){let key=current.includes('zokkon')?'zokkon_end_card.png':current.includes('mystery')?'mystery_end_card.png':current.includes('true')?'true_end_card.png':current.includes('dislike')||current.includes('analysis')||current.includes('heat')?'bad_end_card.png':'normal_end_card.png';app.innerHTML=`<div class="spark"></div><div class="app"><div class="top"><img class="logo" src="${U['ui/logo_title.png']}"><button class="iconbtn heart" onclick="openLog()"></button><button class="iconbtn menu" onclick="openMenu()"></button></div><div class="stage" style="height:330px"><img class="bg" src="${U[s.bg]}"><div class="veil"></div></div><div class="endcard"><img src="${U['endings/'+key]}"><div class="endtext">${esc(s.text)}</div>${choiceHtml(s.choices)}</div></div>`;applyVars();}
window.openLog=()=>{let m=$('#modal');$('#modalTitle').textContent='会話ログ';$('#modalBody').innerHTML=log.length?log.map(x=>`<div class="logitem">${esc(x.answer)}</div>`).join(''):'<div class="subtle">まだログはありません。</div>';m.classList.add('open')}
window.openMenu=()=>{let m=$('#modal');$('#modalTitle').textContent='MENU';$('#modalBody').innerHTML=`<button class="bigbtn" onclick="restart()">最初から</button><button class="bigbtn" style="margin-top:8px;background:#b99ac8" onclick="closeModal()">戻る</button>`;m.classList.add('open')}
window.closeModal=()=>$('#modal').classList.remove('open');window.restart=()=>{sessionStorage.clear();log=[];current='s1h';closeModal();render()}
window.startGame=()=>{document.querySelector('.start').remove();render()}
applyVars();
</script></body></html>
